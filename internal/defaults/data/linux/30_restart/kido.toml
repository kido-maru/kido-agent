# ボタンに出す名前
name = "再起動"
# アイコン: https://lucide.dev/icons から選んで、名前を書いてください
icon = "rotate-cw"
# 押したときに「実行しますか?」と確認を出します(要らなければ行ごと消す)
confirm = true
# 実行するファイル。フォルダに実行できるファイルが 1 つなら書かなくてよい
# run = "restart.sh"
# 終わるまで待ち、失敗(終了コードが 0 以外)を起動ページに知らせたいときは # を外す。
# 15 秒ほどで終わるものだけに付ける。長く動くものには付けない(.sh など、スクリプトだけ)
# wait = true

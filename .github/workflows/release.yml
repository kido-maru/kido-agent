name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Windows の zip は pwsh の Compress-Archive で作る(ubuntu の runner に入っている)
      - run: sh ci/build-dist.sh "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS install/install.ps1 install/install.sh
      # 入れ方のスクリプトも同じリリースに付ける。latest/download/install.ps1 で最新の版が取れ、
      # 版を決めたいときは download/<版>/install.ps1 で、その版のスクリプトと配る物がそろう
